name: Syntax checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check shell syntax
        run: |
          bash -n scripts/preflight.sh
          bash -n scripts/run_md_new_protein.sh
          bash -n scripts/run_cas12g_md.sh
      - name: Check Python syntax
        run: |
          python -m py_compile scripts/build_cas12g_mutants.py scripts/compare_replicates.py analysis/analyze_cas12g_md.py
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
